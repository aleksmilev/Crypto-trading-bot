# Development override: hot reload, source mounts, direct ports, admin UIs.
#   docker compose -f compose.yml -f compose.dev.yml up --build

x-service-dev: &service-dev
  build:
    target: dev
  volumes:
    - ./packages/shared/src:/app/packages/shared/src
    - ./packages/db/src:/app/packages/db/src

services:
  caddy:
    environment:
      ALLOWED_CLIENT_IPS: ${ALLOWED_CLIENT_IPS:-127.0.0.1}

  frontend:
    build:
      target: dev
    image: ai-trading-frontend:dev
    environment:
      VITE_API_PROXY_TARGET: http://gateway:3000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    ports:
      - "5173:5173"

  gateway:
    <<: *service-dev
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/gateway/src:/app/services/gateway/src
    ports:
      - "3000:3000"

  manager:
    <<: *service-dev
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
      - ./services/manager/src:/app/services/manager/src

  market:
    <<: *service-dev
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
      - ./services/market/src:/app/services/market/src

  features:
    <<: *service-dev
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
      - ./services/features/src:/app/services/features/src

  ai:
    <<: *service-dev
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
      - ./services/ai/src:/app/services/ai/src

  risk:
    <<: *service-dev
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
      - ./services/risk/src:/app/services/risk/src

  execution:
    <<: *service-dev
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/db/src:/app/packages/db/src
      - ./services/execution/src:/app/services/execution/src

  postgres:
    ports:
      - "5432:5432"
    networks:
      - backend-net
      - egress-net

  grafana:
    ports:
      - "3001:3000"

  adminer:
    image: adminer:4
    container_name: trading-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
      - egress-net

volumes:
  redis_insight_data:
