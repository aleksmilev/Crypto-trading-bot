global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:3000"]
  - job_name: "manager"
    static_configs:
      - targets: ["manager:3000"]
  - job_name: "market"
    static_configs:
      - targets: ["market:3000"]
  - job_name: "features"
    static_configs:
      - targets: ["features:3000"]
  - job_name: "ai"
    static_configs:
      - targets: ["ai:3000"]
  - job_name: "risk"
    static_configs:
      - targets: ["risk:3000"]
  - job_name: "execution"
    static_configs:
      - targets: ["execution:3000"]
